<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Tanks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="600"></canvas>
        <div id="ui">
            <div id="player-info">
                <div id="player1-info" class="player-panel active">
                    <h3>You (Player 1)</h3>
                    <p>Bullets: <span id="p1-bullets">∞</span></p>
                    <p>Moves: <span id="p1-moves">∞</span></p>
                    <p>Angle: <span id="p1-angle">45</span>°</p>
                    <p>Power: <span id="p1-power">50</span>%</p>
                </div>
                <div id="player2-info" class="player-panel">
                    <h3>Player 2</h3>
                    <p>Bullets: <span id="p2-bullets">∞</span></p>
                    <p>Moves: <span id="p2-moves">∞</span></p>
                    <p>Angle: <span id="p2-angle">135</span>°</p>
                    <p>Power: <span id="p2-power">50</span>%</p>
                </div>
            </div>
            <div id="controls">
                <h3>Controls</h3>
                <p><strong>A/D</strong> - Move tank</p>
                <p><strong>W/S</strong> - Adjust angle</p>
                <p><strong>Q/E</strong> - Adjust power</p>
                <p><strong>SPACE</strong> - Fire</p>
            </div>
            <div id="game-message"></div>
            <div id="turn-indicator" style="display:none"></div>
            <div id="current-turn" style="display:none"></div>
        </div>
    </div>
    <script type="module" src="/game.js"></script>
</body>
</html>
